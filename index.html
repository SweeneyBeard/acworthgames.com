<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acworth Games is an independent game studio. Our first games are currently in development.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="Acworth Games">
  <meta property="og:description" content="Independent games, thoughtfully made. First release in development.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://acworthgames.com/">
  <meta property="og:image" content="https://acworthgames.com/assets/acworth-games-logo.jpg?v=2">
  <title>Acworth Games | Independent Game Studio</title>
  <link rel="icon" href="/assets/acworth-games-logo.jpg?v=2">
  <link rel="stylesheet" href="/styles.css?v=5">
</head>
<body>
  <main class="page">
    <section class="hero" aria-labelledby="site-title">
      <img
        class="logo"
        src="/assets/acworth-games-logo.jpg?v=2"
        width="600"
        height="600"
        alt="Acworth Games logo with a sunset, mountain, lake, and pine trees"
      >

      <div class="copy">
        <p class="eyebrow">Independent game studio</p>
        <h1 id="site-title">Games worth getting lost in.</h1>
        <p class="intro">
          Acworth Games is an independent game developer focused on creating polished,
          memorable experiences. Our first title is in development.
        </p>
        <div class="status" aria-label="Publishing status">
          <span class="status-dot" aria-hidden="true"></span>
          No games published yet. Stay tuned.
        </div>
        <p class="featured-game"><a href="/abrecan/">Discover Abrecan <span aria-hidden="true">→</span></a></p>
      </div>
    </section>
  </main>

  <footer>
    <span>© 2026 Acworth Games, LLC</span>
    <nav class="footer-links" aria-label="Legal">
      <a href="/privacy/">Privacy</a>
      <a href="/terms/">Terms</a>
    </nav>
  </footer>
</body>
</html>
